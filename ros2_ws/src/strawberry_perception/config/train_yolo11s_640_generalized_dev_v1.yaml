# Development-only random multi-plant adaptation. The qualification split is
# deliberately absent from this training configuration and remains available
# only for a post-training go/no-go evaluation.
model: outputs/perception/yolo11s_640_train_audit_v1/weights/best.pt
data: data/processed/generalized_development_capture_v1/dataset.yaml
task: detect
mode: train
imgsz: 640
epochs: 18
batch: 8
device: 0
workers: 4
pretrained: true
optimizer: SGD
lr0: 0.0001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
seed: 20260812
deterministic: true
amp: false
patience: 0
save: true
save_period: 6
cache: false
close_mosaic: 4
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 0.0
translate: 0.05
scale: 0.2
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 0.5
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
project: outputs/perception
name: yolo11s_640_generalized_dev_v1
exist_ok: false
plots: true
verbose: true
