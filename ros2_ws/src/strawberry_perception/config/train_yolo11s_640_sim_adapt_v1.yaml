# ADR-0021 single simulator-adaptation claim. The model starts from the
# frozen real-image baseline checkpoint. Only the 501 registered real training
# images and 216 synthetic training images are used for optimization; the
# synthetic held-out split is the only in-training validation source.
model: outputs/perception/yolo11s_640/weights/best.pt
data: data/processed/yolo11s_640_sim_adapt_v1/dataset.yaml
task: detect
mode: train
imgsz: 640
epochs: 30
batch: 8
device: 0
workers: 4
pretrained: true
optimizer: SGD
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: false
seed: 20260603
deterministic: true
amp: false
patience: 30
save: true
save_period: 5
cache: false
close_mosaic: 5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
project: outputs/perception
name: yolo11s_640_sim_adapt_v1
exist_ok: false
plots: true
verbose: true
