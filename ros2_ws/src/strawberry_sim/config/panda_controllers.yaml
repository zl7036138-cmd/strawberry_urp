controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_wrist_roll_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

    panda_gripper_right_controller:
      type: parallel_gripper_action_controller/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
    # Effort command interface: Jazzy JTC runs closed-loop PID per joint with
    # velocity feedforward. This balances the attached-fruit gravity torque
    # (gravity compensation by feedback) instead of the gz_ros2_control
    # position-interface velocity law that sagged past tolerance in v9/v10
    # and limit-cycled at gain 3.0 in v11.
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    gains:
      panda_joint1: {p: 300.0, i: 150.0, d: 10.0, ff_velocity_scale: 1.0}
      panda_joint2: {p: 300.0, i: 150.0, d: 10.0, ff_velocity_scale: 1.0}
      panda_joint3: {p: 300.0, i: 150.0, d: 10.0, ff_velocity_scale: 1.0}
      panda_joint4: {p: 300.0, i: 150.0, d: 10.0, ff_velocity_scale: 1.0}
      panda_joint5: {p: 60.0, i: 40.0, d: 3.0, ff_velocity_scale: 1.0}
      panda_joint6: {p: 60.0, i: 40.0, d: 3.0, ff_velocity_scale: 1.0}
    allow_nonzero_velocity_at_trajectory_end: true
    # A position-only Gazebo system can lag the time-parameterized command.
    # Require the real joint state to converge before reporting success instead
    # of treating the final trajectory timestamp as sufficient.
    constraints:
      goal_time: 8.0
      stopped_velocity_tolerance: 0.02
      # Keep path and goal error within 0.05 rad. The Cartesian endpoint and a
      # separate live-joint hard-limit monitor independently fail closed.
      panda_joint1: {trajectory: 0.05, goal: 0.05}
      panda_joint2: {trajectory: 0.05, goal: 0.05}
      panda_joint3: {trajectory: 0.05, goal: 0.05}
      panda_joint4: {trajectory: 0.05, goal: 0.05}
      panda_joint5: {trajectory: 0.05, goal: 0.05}
      panda_joint6: {trajectory: 0.05, goal: 0.05}

panda_wrist_roll_controller:
  ros__parameters:
    joints:
      - panda_joint7
    # Position interface: the plugin's position velocity law handles this
    # near-zero-gravity axis fine (v9-v11 tracked it perfectly) and cannot
    # saturate - unlike the effort path (v19 receipt).
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 8.0
      stopped_velocity_tolerance: 0.02
      panda_joint7: {trajectory: 0.05, goal: 0.05}

panda_gripper_controller:
  ros__parameters:
    joint: panda_finger_joint1
    state_interfaces: [position, velocity]
    allow_stalling: true
    # Gazebo may need several controller cycles to produce the first measured
    # finger displacement immediately after a long arm trajectory.  The old
    # 0.25 s gate could report a false stall at the fully open 0.04 m position.
    # Runtime manipulation still rejects any stalled close with <2 mm travel.
    stall_timeout: 1.0
    goal_tolerance: 0.003

panda_gripper_right_controller:
  ros__parameters:
    joint: panda_finger_joint2
    state_interfaces: [position, velocity]
    allow_stalling: true
    # DART does not enforce the Panda mimic constraint, so the right finger
    # receives the same bounded command through its own single-joint action.
    stall_timeout: 1.0
    goal_tolerance: 0.003
